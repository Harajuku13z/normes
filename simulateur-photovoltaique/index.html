<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur Photovoltaïque — Normes Rénovation</title>
<link rel="stylesheet" href="sim/styles.css?v=14">
</head>
<body>

  <div class="frame">
    <div class="app-scroll">

      <header class="topbar">
        <img class="logo" src="assets/logo-horizontal.png" alt="Normes Rénovation — Expert en solution de rénovation pour la maison">
        <button class="help-btn"><span>Besoin d'aide ?</span><span class="q">?</span></button>
      </header>

      <nav class="phases" id="phases" aria-label="Progression">
        <div class="phase active"><div class="dot">1</div><div class="plabel">Votre toiture</div></div>
        <div class="phase-line"></div>
        <div class="phase"><div class="dot">2</div><div class="plabel">Votre consommation</div></div>
        <div class="phase-line"></div>
        <div class="phase"><div class="dot">3</div><div class="plabel">Votre résultat</div></div>
      </nav>

      <div class="microbar">
        <span class="count" id="microCount">1 / 12</span>
        <div class="track"><div class="fill" id="microFill" style="width:8.33%"></div></div>
      </div>

      <main class="stage">
        <section class="card" id="card" data-screen-label="Étape"></section>
      </main>

    </div>
  </div>

  <script src="sim/app.js?v=19"></script>
</body>
</html>
